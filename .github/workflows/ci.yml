name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit + workflow simulation tests
        run: npm test
      - name: Generated workflow JSON is up to date and every Code node compiles
        run: npm run check
